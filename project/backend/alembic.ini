
[alembic]
script_location = alembic
sqlalchemy.url = sqlite:///./db.sqlite3

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers = console
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
level = INFO
args = (sys.stdout,)

[formatter_generic]
format = %(asctime)s %(levelname)s %(message)s
